<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brainUp — Интерактивті білім платформасы</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --success-bg: #ecfdf5;
            --success-border: #10b981;
            --success-text: #065f46;
            --error-bg: #fef2f2;
            --error-border: #ef4444;
            --error-text: #991b1b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Жоғарғы сайт мәзірі (Navbar) */
        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--primary);
        }

        .nav-badge {
            background: #eff6ff;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Негізгі орталық аймақ */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card-container {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
            width: 100%;
            max-width: 680px;
            padding: 40px;
        }

        /* Бастапқы экран */
        .hero-section {
            text-align: center;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-dark);
            line-height: 1.25;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            max-width: 380px;
            margin: 0 auto 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .clean-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .clean-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .primary-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            max-width: 380px;
        }

        .primary-btn:hover {
            background: var(--primary-hover);
        }

        .primary-btn:active {
            transform: scale(0.99);
        }

        /* Тест экраны */
        .top-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .timer-pill {
            background: #f1f5f9;
            color: var(--text-dark);
            padding: 5px 12px;
            border-radius: 8px;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #f1f5f9;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 25%;
            background: var(--primary);
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        .question-heading {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            line-height: 1.4;
            color: var(--text-dark);
        }

        .answers-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-item {
            background: var(--bg-card);
            border: 1.5px solid var(--border-light);
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dark);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
        }

        .answer-item:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f8fafc;
        }

        .letter-badge {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f5f9;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .answer-item:hover:not(:disabled) .letter-badge {
            background: var(--primary);
            color: #fff;
        }

        .answer-item.correct {
            background: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            color: var(--success-text) !important;
        }

        .answer-item.correct .letter-badge {
            background: var(--success-border);
            color: #fff;
        }

        .answer-item.wrong {
            background: var(--error-bg) !important;
            border-color: var(--error-border) !important;
            color: var(--error-text) !important;
        }

        .answer-item.wrong .letter-badge {
            background: var(--error-border);
            color: #fff;
        }

        /* Нәтиже экраны */
        .result-view {
            text-align: center;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #eff6ff;
            border: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 24px auto;
        }

        .score-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .score-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .hidden { display: none; }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 500px) {
            .card-container { padding: 25px 20px; }
            .hero-title { font-size: 1.6rem; }
            .navbar { padding: 14px 20px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand">brain<span>Up</span></a>
        <div class="nav-badge">Онлайн тестілеу</div>
    </nav>

    <main class="main-wrapper">
        <div class="card-container">
            <!-- Бастапқы экран -->
            <div id="start-screen" class="hero-section">
                <h1 class="hero-title">Біліміңізді тексеріп, жаңа деңгейге көтеріліңіз</h1>
                <p class="hero-desc">Қысқа әрі қызықты интерактивті сұрақтарға жауап беріп, өз нәтижеңізді бірден біліңіз.</p>
                
                <div class="input-group">
                    <label class="input-label" for="player-name">Аты-жөніңіз</label>
                    <input type="text" id="player-name" class="clean-input" placeholder="Мысалы: Әлихан" maxlength="25">
                </div>
                
                <button class="primary-btn" onclick="startQuiz()">Тестті бастау</button>
            </div>

            <!-- Сұрақтар экраны -->
            <div id="quiz-screen" class="hidden">
                <div class="top-meta">
                    <span id="q-progress-text">Сұрақ 1 / 4</span>
                    <span class="timer-pill">⏱ <span id="timer">15</span> сек</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
