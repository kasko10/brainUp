<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brainUp — Интерактивті білім платформасы</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-page: #070a13;
            --bg-card: rgba(19, 26, 42, 0.78);
            --bg-surface: #1b2438;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-bg: rgba(16, 185, 129, 0.2);
            --success-border: #10b981;
            --success-text: #6ee7b7;
            --error-bg: rgba(239, 68, 68, 0.2);
            --error-border: #ef4444;
            --error-text: #fca5a5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Қозғалмалы жарық сфералары (Ambient Glow) */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(95px);
            z-index: -1;
            opacity: 0.45;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        .orb-1 { width: 380px; height: 380px; background: #4f46e5; top: -80px; left: -80px; }
        .orb-2 { width: 340px; height: 340px; background: #7c3aed; bottom: -60px; right: -60px; animation-delay: -6s; }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(45px, 35px) scale(1.15); }
        }

        /* Жоғарғы навигациялық мәзір */
        .navbar {
            background: rgba(15, 21, 36, 0.78);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--text-main);
            cursor: pointer;
            letter-spacing: -0.5px;
        }
        .brand span {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role-switcher { display: flex; gap: 10px; }
        .role-btn {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
        }
        .role-btn.active, .role-btn:hover {
            background: rgba(99, 102, 241, 0.22);
            color: #c7d2fe;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
        }

        /* Орталық аймақ */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 28px 16px;
            gap: 20px;
        }

        .card-container {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
            width: 100%;
            max-width: 640px;
            padding: 38px;
            transition: border-color 0.3s;
            animation: fadeUp 0.45s ease;
        }
        .card-container:hover { border-color: rgba(99, 102, 241, 0.4); }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-section { text-align: center; }
        .nav-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.84rem;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .hero-title { font-size: 1.95rem; font-weight: 800; margin-bottom: 12px; line-height: 1.25; }
        .hero-desc { color: var(--text-muted); font-size: 1.02rem; margin-bottom: 26px; line-height: 1.55; }

        .input-group { max-width: 400px; margin: 0 auto 16px; text-align: left; }
        .input-label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }

        .clean-input, .clean-select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(11, 15, 25, 0.75);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: 0.2s;
            margin-bottom: 12px;
        }
        .clean-input:focus, .clean-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .primary-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            padding: 15px 32px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
        }
        .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5); }
        .primary-btn:active { transform: translateY(0); }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 15px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .secondary-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--text-muted); }

        /* Тест экраны */
        .top-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.92rem; font-weight: 600; color: var(--text-muted); }
        .timer-pill { background: var(--bg-surface); color: var(--text-main); padding: 6px 14px; border-radius: 10px; border: 1px solid var(--border-color); }
        .progress-bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; overflow: hidden; margin-bottom: 26px; }
        .progress-bar-fill { height: 100%; width: 25%; background: linear-gradient(90deg, #6366f1, #a855f7); border-radius: 99px; transition: width 0.3s ease; }

        .question-heading { font-size: 1.35rem; font-weight: 700; margin-bottom: 22px; line-height: 1.45; }
        .answers-stack { display: flex; flex-direction: column; gap: 12px; }

        .answer-item {
            background: rgba(27, 36, 56, 0.85);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 15px 18px;
            font-size: 1.02rem;
            font-weight: 500;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
        }
        .answer-item:hover:not(:disabled) { border-color: var(--primary); background: rgba(99, 102, 241, 0.16); transform: translateX(4px); }

        .letter-badge {
            width: 34px; height: 34px; border-radius: 9px; background: rgba(11, 15, 25, 0.7); color: var(--text-muted);
            border: 1px solid var(--border-color); font-weight: 700; font-size: 0.9rem;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .answer-item:hover:not(:disabled) .letter-badge { background: var(--primary); border-color: var(--primary); color: #fff; }

        .answer-item.correct { background: var(--success-bg) !important; border-color: var(--success-border) !important; color: var(--success-text) !important; }
        .answer-item.correct .letter-badge { background: var(--success-border); border-color: var(--success-border); color: #fff; }
        .answer-item.wrong { background: var(--error-bg) !important; border-color: var(--error-border) !important; color: var(--error-text) !important; }
        .answer-item.wrong .letter-badge { background: var(--error-border); border-color: var(--error-border); color: #fff; }

        /* Нәтиже экраны */
        .result-view { text-align: center; }
        .score-circle {
            width: 135px; height: 135px; border-radius: 50%; background: rgba(99, 102, 241, 0.14);
            border: 4px solid var(--primary); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 22px auto;
        }
        .score-number { font-size: 2.1rem; font-weight: 800; color: #a5b4fc; }
        .score-label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
