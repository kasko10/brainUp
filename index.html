<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brainUp // CYBER ARENA</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07080d;
            --card-bg: rgba(16, 20, 34, 0.9);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff66;
            --neon-red: #ff2a2a;
            --text-main: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 35px 35px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .arena-box {
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 20px rgba(0, 243, 255, 0.05);
            width: 100%;
            max-width: 720px;
            padding: 35px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 12px var(--neon-cyan);
            margin-bottom: 5px;
        }

        .logo span {
            color: var(--neon-pink);
            text-shadow: 0 0 12px var(--neon-pink);
        }

        .tagline {
            text-align: center;
            color: var(--neon-cyan);
            letter-spacing: 3px;
            font-size: 0.95rem;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .cyber-input {
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 0 auto 25px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        .cyber-input:focus {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            border-color: #fff;
        }

        .cyber-btn {
            display: block;
            margin: 0 auto;
            background: transparent;
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            padding: 14px 45px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .cyber-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        /* Ойын экраны */
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: width 0.1s linear;
        }

        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            color: var(--neon-cyan);
        }

        .streak-badge {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .question-box {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 28px;
            line-height: 1.4;
            color: #fff;
            border-left: 4px solid var(--neon-pink);
            padding-left: 15px;
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.25);
            color: #fff;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s;
        }

        .option-card:hover:not(:disabled) {
            background: rgba(0, 243, 255, 0.12);
            border-color: var(--neon-cyan);
            transform: translateX(4px);
        }

        .option-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 4px 10px;
            min-width: 36px;
            text-align: center;
        }

        .option-card.correct {
            background: rgba(0, 255, 102, 0.2) !important;
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .option-card.wrong {
            background: rgba(255, 42, 42, 0.2) !important;
            border-color: var(--neon-red) !important;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
        }

        .hidden { display: none; }

        /* Нәтиже экраны */
        .result-stats {
            text-align: center;
            margin: 25px 0;
        }

        .final-points {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px var(--neon-cyan);
            margin: 15px 0;
        }

        @media (max-width: 600px) {
            .options-list { grid-template-columns: 1fr; }
            .logo { font-size: 2.1rem; }
        }
    </style>
</head>
<body>

    <div class="arena-box">
        <!-- Бастапқы экран -->
        <div id="start-screen">
            <div class="logo">brain<span>Up</span></div>
            <div class="tagline">// NEURAL QUIZ ARENA v2.0</div>
            <input type="text" id="player-name" class="cyber-input" placeholder="ОЙЫНШЫ ЛАҚАП АТЫ..." maxlength="18">
            <button class="cyber-btn" onclick="startGame()">ЖҮЙЕГЕ КІРУ</button>
        </div>

        <!-- Ойын экраны -->
        <div id="game-screen" class="hidden">
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
            <div class="hud-bar">
                <span id="q-counter">МОДУЛЬ 01/04</span>
                <span id="streak-display" class="streak-badge">STREAK: x1</span>
                <span id="score-display">XP: 0</span>
            </div>
            <div class="question-box" id="question-text">Сұрақ жүктелуде...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <!-- Нәтиже экраны -->
        <div id="result-screen" class="hidden">
            <div class="logo">brain<span>Up</span></div>
            <div class="tagline">// МИССИЯ АЯҚТАЛДЫ</div>
            <div class="result-stats">
                <p id="final-player" style="font-size: 1.4rem; letter-spacing: 1px;"></p>
                <div class="final-points" id="final-score">0 XP</div>
                <p id="accuracy-text" style="color: #94a3b8; font-size: 1.1rem;"></p>
            </div>
            <button class="cyber-btn" onclick="location.reload()">ҚАЙТА ІСКЕ ҚОСУ</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Қазақстанның астанасы қай қала?",
                options: ["Алматы", "Астана", "Шымкент", "Түркістан"],
                correct: 1
            },
            {
                q: "Күн жүйесіндегі ең үлкен ғаламшар қалай аталады?",
                options: ["Марс", "Жер", "Юпитер", "Сатурн"],
                correct: 2
            },
            {
                q: "1 байт ақпаратта неше бит бар?",
                options: ["4 бит", "8 бит", "16 бит", "32 бит"],
                correct: 1
            },
            {
                q: "Абай Құнанбайұлы қай жылы дүниеге келді?",
                options: ["1845", "1835", "1855", "1865"],
                correct: 0
            }
        ];

        const tags = ["A", "B", "C", "D"];
        let currentQ = 0;
        let score = 0;
        let streak = 1;
        let correctCount = 0;
        let timeLeft = 15;
        let timerInterval;
        let playerName = "";
        let isAnswered = false;

        function startGame() {
            const input = document.getElementById("player-name").value.trim();
            if (!input) {
                alert("Жүйеге кіру үшін лақап атыңызды енгізіңіз!");
                return;
            }
            playerName = input.toUpperCase();
            document.getElementById("start-screen").classList.add("hidden");
