<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brainUp — Интерактивті білім платформасы</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-page: #e8f0ec;
            --bg-card: #fcfdfb;
            --primary: #15803d;
            --primary-hover: #166534;
            --primary-soft: #dcfce7;
            --text-dark: #14261c;
            --text-muted: #52665a;
            --border-light: #d1dfd7;
            --success-bg: #dcfce7;
            --success-border: #16a34a;
            --success-text: #14532d;
            --error-bg: #fee2e2;
            --error-border: #dc2626;
            --error-text: #7f1d1d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(160deg, #e6efe9 0%, #dce8e2 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Жоғарғы сайт мәзірі (Navbar) */
        .navbar {
            background: rgba(252, 253, 251, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--text-dark);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--primary);
        }

        .nav-badge {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* Негізгі орталық аймақ */
        .main-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .card-container {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            box-shadow: 0 15px 35px -5px rgba(20, 38, 28, 0.08);
            width: 100%;
            max-width: 680px;
            padding: 42px;
        }

        /* Бастапқы экран */
        .hero-section {
            text-align: center;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-dark);
            line-height: 1.25;
        }

        .hero-desc {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            max-width: 380px;
            margin: 0 auto 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .clean-input {
            width: 100%;
            padding: 14px 16px;
            background: #f4f8f5;
            border: 1.5px solid var(--border-light);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .clean-input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.14);
        }

        .primary-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px 36px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2);
        }

        .primary-btn:hover {
            background: var(--primary-hover);
        }

        .primary-btn:active {
            transform: scale(0.99);
        }

        /* Тест экраны */
        .top-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .timer-pill {
            background: #eef4f0;
            color: var(--text-dark);
            padding: 6px 14px;
            border-radius: 10px;
            font-variant-numeric: tabular-nums;
            border: 1px solid var(--border-light);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #e4ede8;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 25%;
            background: var(--primary);
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        .question-heading {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 24px;
            line-height: 1.45;
            color: var(--text-dark);
        }

        .answers-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-item {
            background: #f6faf7;
            border: 1.5px solid var(--border-light);
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-dark);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
        }

        .answer-item:hover:not(:disabled) {
            border-color: var(--primary);
            background: #eff7f2;
        }

        .letter-badge {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: #e3ede7;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .answer-item:hover:not(:disabled) .letter-badge {
            background: var(--primary);
            color: #fff;
        }

        .answer-item.correct {
            background: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            color: var(--success-text) !important;
        }

        .answer-item.correct .letter-badge {
            background: var(--success-border);
            color: #fff;
        }

        .answer-item.wrong {
            background: var(--error-bg) !important;
            border-color: var(--error-border) !important;
            color: var(--error-text) !important;
        }

        .answer-item.wrong .letter-badge {
            background: var(--error-border);
            color: #fff;
        }

        /* Нәтиже экраны */
        .result-view {
            text-align: center;
        }

        .score-circle {
            width: 135px;
            height: 135px;
            border-radius: 50%;
            background: var(--primary-soft);
            border: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 24px auto;
        }

        .score-number {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--primary);
        }

        .score-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .hidden { display: none; }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 500px) {
            .card-container { padding: 26px 20px; }
            .hero-title { font-size: 1.6rem; }
            .navbar { padding: 14px 20px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="brand">brain<span>Up</span></a>
        <div class="nav-badge">Онлайн тестілеу</div>
    </nav>

    <main class="main-wrapper">
        <div class="card-container">
            <!-- Бастапқы экран -->
            <div id="start-screen" class="hero-section">
                <h1 class="hero-title">Біліміңізді тексеріп, жаңа деңгейге көтеріліңіз</h1>
                <p class="hero-desc">Қысқа әрі қызықты интерактивті сұрақтарға жауап беріп, өз нәтижеңізді бірден біліңіз.</p>
                
                <div class="input-group">
                    <label class="input-label" for="player-name">Аты-жөніңіз</label>
                    <input type="text" id="player-name" class="clean-input" placeholder="Мысалы: Әлихан" maxlength="25">
                </div>
                
                <button class="primary-btn" onclick="startQuiz()">Тестті бастау</button>
            </div>

            <!-- Сұрақтар экраны -->
            <div id="quiz-screen" class="hidden">
                <div class="top-meta">
