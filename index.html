<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brainUp — Интерактивті білім аренасы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #3a0ca3, #46178f, #7209b7);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #fff;
            color: #333;
            width: 100%;
            max-width: 700px;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
            text-align: center;
        }
        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            color: #46178f;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }
        .logo span {
            color: #ff9800;
        }
        .subtitle {
            margin-bottom: 25px;
            color: #666;
            font-size: 1.1rem;
        }
        input {
            width: 80%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #46178f;
        }
        .start-btn {
            background: #26890c;
            color: #fff;
            border: none;
            padding: 15px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1b6308;
            transition: all 0.1s;
        }
        .start-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b6308;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .timer {
            background: #46178f;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 10px rgba(70, 23, 143, 0.3);
        }
        .question-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
            min-height: 60px;
            color: #222;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .opt-btn {
            border: none;
            color: #fff;
            padding: 20px 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            min-height: 80px;
        }
        .opt-btn:hover { opacity: 0.92; }
        .opt-btn:active { transform: scale(0.98); }
        .opt-0 { background: #e21b3c; box-shadow: 0 4px 0 #a8122b; }
        .opt-1 { background: #1368ce; box-shadow: 0 4px 0 #0d4a94; }
        .opt-2 { background: #d89e00; box-shadow: 0 4px 0 #9c7200; }
        .opt-3 { background: #26890c; box-shadow: 0 4px 0 #1a6108; }
        .hidden { display: none; }
        .score-box {
            font-size: 2.3rem;
            color: #46178f;
            margin: 20px 0;
            font-weight: 900;
        }
        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
            input { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Бастапқы экран -->
        <div id="start-screen">
            <div class="logo">brain<span>Up</span> 🧠</div>
            <p class="subtitle">Ой ұшқырлығы мен жылдамдық жарысына қош келдіңіз!</p>
            <input type="text" id="player-name" placeholder="Есіміңізді енгізіңіз..." maxlength="20">
            <br>
            <button class="start-btn" onclick="startGame()">Бастау</button>
        </div>

        <!-- Сұрақтар экраны -->
        <div id="game-screen" class="hidden">
            <div class="header-bar">
                <span id="q-counter">Сұрақ 1 / 4</span>
                <div class="timer" id="timer">15</div>
                <span id="score-display">Ұпай: 0</span>
            </div>
            <div class="question-text" id="question-text">Сұрақ мәтіні</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- Нәтиже экраны -->
        <div id="result-screen" class="hidden">
            <div class="logo">brain<span>Up</span> 🏆</div>
            <p id="final-player" style="font-size: 1.3rem; margin-top: 10px; font-weight: bold;"></p>
            <div class="score-box" id="final-score">0 ұпай</div>
            <button class="start-btn" onclick="location.reload()">Қайта ойнау</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Қазақстанның астанасы қай қала?",
                options: ["Алматы", "Астана", "Шымкент", "Түркістан"],
                correct: 1
            },
            {
                q: "Ең үлкен ғаламшар қалай аталады?",
                options: ["Марс", "Жер", "Юпитер", "Сатурн"],
                correct: 2
            },
            {
                q: "1 байтта неше бит бар?",
                options: ["4 бит", "8 бит", "16 бит", "32 бит"],
                correct: 1
            },
            {
                q: "Абай Құнанбайұлы қай жылы дүниеге келді?",
                options: ["1845", "1835", "1855", "1865"],
                correct: 0
            }
        ];

        let currentQ = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;
        let playerName = "";

        function startGame() {
            const input = document.getElementById("player-name").value.trim();
            if (!input) {
                alert("Алдымен есіміңізді жазыңыз!");
                return;
            }
            playerName = input;
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById("timer").innerText = timeLeft;
            document.getElementById("q-counter").innerText = `Сұрақ ${currentQ + 1} / ${questions.length}`;
            
            const qData = questions[currentQ];
            document.getElementById("question-text").innerText = qData.q;
            
            const optionsDiv = document.getElementById("options-container");
            optionsDiv.innerHTML = "";
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = `opt-btn opt-${index}`;
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsDiv.appendChild(btn);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            const correctIndex = questions[currentQ].correct;
            if (selectedIndex === correctIndex) {
                score += 500 + (timeLeft * 30);
                document.getElementById("score-display").innerText = `Ұпай: ${score}`;
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-player").innerText = `Ойыншы: ${playerName}`;
            document.getElementById("final-score").innerText = `${score} ұпай`;
        }
    </script>
</body>
</html>
