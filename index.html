<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KASKO QUIZ — Интерактивті викторина</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #46178f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #fff;
            color: #333;
            width: 100%;
            max-width: 700px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #46178f;
            margin-bottom: 15px;
            font-size: 2.2rem;
        }
        input {
            width: 80%;
            padding: 14px;
            font-size: 1.1rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .start-btn {
            background: #26890c;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1b6308;
        }
        .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1b6308;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .timer {
            background: #46178f;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
        }
        .question-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
            min-height: 60px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .opt-btn {
            border: none;
            color: #fff;
            padding: 20px 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
            min-height: 80px;
        }
        .opt-btn:hover { opacity: 0.9; }
        .opt-0 { background: #e21b3c; box-shadow: 0 4px 0 #a8122b; } /* Қызыл */
        .opt-1 { background: #1368ce; box-shadow: 0 4px 0 #0d4a94; } /* Көк */
        .opt-2 { background: #d89e00; box-shadow: 0 4px 0 #9c7200; } /* Сары */
        .opt-3 { background: #26890c; box-shadow: 0 4px 0 #1a6108; } /* Жасыл */
        .hidden { display: none; }
        .score-box {
            font-size: 2rem;
            color: #46178f;
            margin: 20px 0;
            font-weight: bold;
        }
        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Бастапқы экран -->
        <div id="start-screen">
            <h1>KASKO QUIZ 🎯</h1>
            <p style="margin-bottom: 20px; color: #666;">Ойынды бастау үшін есіміңізді жазыңыз</p>
            <input type="text" id="player-name" placeholder="Есіміңіз..." maxlength="20">
            <br>
            <button class="start-btn" onclick="startQuiz()">Ойынды бастау</button>
        </div>

        <!-- Сұрақтар экраны -->
        <div id="quiz-screen" class="hidden">
            <div class="header-bar">
                <span id="q-counter">Сұрақ 1 / 4</span>
                <div class="timer" id="timer">15</div>
                <span id="score-display">Ұпай: 0</span>
            </div>
            <div class="question-text" id="question-text">Сұрақ мәтіні</div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- Нәтиже экраны -->
        <div id="result-screen" class="hidden">
            <h1>Ойын аяқталды! 🏆</h1>
            <p id="final-player" style="font-size: 1.3rem; margin-top: 10px;"></p>
            <div class="score-box" id="final-score">0 ұпай</div>
            <button class="start-btn" onclick="location.reload()">Қайта ойнау</button>
        </div>
    </div>

    <script>
        // СҰРАҚТАРДЫ ОСЫ ЖЕРДЕН ӨЗГЕРТУГЕ БОЛАДЫ
        const questions = [
            {
                q: "Қазақстанның астанасы қай қала?",
                options: ["Алматы", "Астана", "Шымкент", "Түркістан"],
                correct: 1 // 0-ден бастап саналады (1 = Астана)
            },
            {
                q: "Ең үлкен ғаламшар қалай аталады?",
                options: ["Марс", "Жер", "Юпитер", "Сатурн"],
                correct: 2 // Юпитер
            },
            {
                q: "1 байтта неше бит бар?",
                options: ["4 бит", "8 бит", "16 бит", "32 бит"],
                correct: 1 // 8 бит
            },
            {
                q: "Абай Құнанбайұлы қай жылы дүниеге келді?",
                options: ["1845", "1835", "1855", "1865"],
                correct: 0 // 1845
            }
        ];

        let currentQ = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;
        let playerName = "";

        function startQuiz() {
            const input = document.getElementById("player-name").value.trim();
            if (!input) {
                alert("Алдымен есіміңізді жазыңыз!");
                return;
            }
            playerName = input;
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById("timer").innerText = timeLeft;
            document.getElementById("q-counter").innerText = `Сұрақ ${currentQ + 1} / ${questions.length}`;
            
            const qData = questions[currentQ];
            document.getElementById("question-text").innerText = qData.q;
            
            const optionsDiv = document.getElementById("options-container");
            optionsDiv.innerHTML = "";
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = `opt-btn opt-${index}`;
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsDiv.appendChild(btn);
            });

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex) {
            clearInterval(timerInterval);
            const correctIndex = questions[currentQ].correct;
            if (selectedIndex === correctIndex) {
                // Жылдам жауап берген сайын көбірек ұпай беріледі (Kahoot сияқты)
                score += 500 + (timeLeft * 30);
                document.getElementById("score-display").innerText = `Ұпай: ${score}`;
            }
            nextQuestion();
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            document.getElementById("final-player").innerText = `Ойыншы: ${playerName}`;
            document.getElementById("final-score").innerText = `${score} ұпай`;
        }
    </script>
</body>
</html>
