<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brainUp — Интерактивті білім платформасы</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0b0f19;
            --bg-card: #131a2a;
            --bg-surface: #1b2438;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #243049;
            --success-bg: rgba(16, 185, 129, 0.18);
            --success-border: #10b981;
            --success-text: #6ee7b7;
            --error-bg: rgba(239, 68, 68, 0.18);
            --error-border: #ef4444;
            --error-text: #fca5a5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: radial-gradient(circle at top center, #162038 0%, #0b0f19 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(19, 26, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { font-size: 1.55rem; font-weight: 800; color: var(--text-main); text-decoration: none; cursor: pointer; }
        .brand span { color: var(--primary); }

        .role-switcher { display: flex; gap: 10px; }
        .role-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .role-btn.active, .role-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border-color: var(--primary);
        }

        .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 20px; }

        .card-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 660px;
            padding: 38px;
        }

        .hero-section { text-align: center; }
        .hero-title { font-size: 1.85rem; font-weight: 800; margin-bottom: 12px; line-height: 1.25; }
        .hero-desc { color: var(--text-muted); font-size: 1rem; margin-bottom: 26px; line-height: 1.5; }

        .input-group { max-width: 420px; margin: 0 auto 16px; text-align: left; }
        .input-label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }

        .clean-input, .clean-select {
            width: 100%;
            padding: 13px 15px;
            background: var(--bg-surface);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.98rem;
            color: var(--text-main);
            outline: none;
            transition: 0.2s;
        }
        .clean-input:focus, .clean-select:focus { border-color: var(--primary); }

        .primary-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }
        .primary-btn:hover { background: var(--primary-hover); }

        .secondary-btn {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .secondary-btn:hover { border-color: var(--text-muted); }

        /* Тест экраны */
        .top-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.92rem; font-weight: 600; color: var(--text-muted); }
        .timer-pill { background: var(--bg-surface); color: var(--text-main); padding: 6px 14px; border-radius: 10px; border: 1px solid var(--border-color); }
        .progress-bar-bg { width: 100%; height: 8px; background: var(--bg-surface); border-radius: 99px; overflow: hidden; margin-bottom: 26px; }
        .progress-bar-fill { height: 100%; width: 25%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 99px; transition: width 0.3s ease; }

        .question-heading { font-size: 1.35rem; font-weight: 700; margin-bottom: 22px; line-height: 1.45; }
        .answers-stack { display: flex; flex-direction: column; gap: 12px; }

        .answer-item {
            background: var(--bg-surface);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 15px 18px;
            font-size: 1.02rem;
            font-weight: 500;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.2s;
        }
        .answer-item:hover:not(:disabled) { border-color: var(--primary); background: #222d45; }

        .letter-badge {
            width: 32px; height: 32px; border-radius: 8px; background: var(--bg-card); color: var(--text-muted);
            border: 1px solid var(--border-color); font-weight: 700; font-size: 0.88rem;
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }

        .answer-item.correct { background: var(--success-bg) !important; border-color: var(--success-border) !important; color: var(--success-text) !important; }
        .answer-item.wrong { background: var(--error-bg) !important; border-color: var(--error-border) !important; color: var(--error-text) !important; }

        /* Нәтиже экраны */
        .result-view { text-align: center; }
        .score-circle {
            width: 130px; height: 130px; border-radius: 50%; background: rgba(99, 102, 241, 0.12);
            border: 4px solid var(--primary); display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px auto;
        }
        .score-number { font-size: 2rem; font-weight: 800; color: #a5b4fc; }
        .score-label { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 420px; margin: 0 auto; }

        /* Басқарушы панелі */
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .q-list { margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 18px; max-height: 240px; overflow-y: auto; text-align: left; }
        .q-list-item {
            background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .del-btn {
            background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600; flex-shrink: 0;
        }
        .del-btn:hover { background: #ef4444; color: #fff; }

        .hidden { display: none; }
        footer { text-align: center; padding: 18px; color: var(--text-muted); font-size: 0.85rem; }

        @media (max-width: 520px) {
            .card-container { padding: 24px 18px; }
            .admin-grid, .btn-row { grid-template-columns: 1fr; }
            .navbar { padding: 14px 18px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand" onclick="goHome()">brain<span>Up</span></div>
        <div class="role-switcher">
            <button type="button" class="role-btn active" id="nav-student" onclick="goHome()">Қатысушы</button>
            <button type="button" class="role-btn" id="nav-admin" onclick="openAdmin()">Басқарушы</button>
        </div>
    </nav>

    <main class="main-wrapper">
        <div class="card-container">
            <!-- 1. Қатысушы: Бастапқы экран -->
            <div id="start-screen" class="hero-section">
                <h1 class="hero-title">Біліміңізді тексеріп, жаңа деңгейге көтеріліңіз</h1>
                <p class="hero-desc" id="total-q-info">Қазір платформада 4 сұрақ дайын тұр.</p>
                <div class="input-group">
                    <label class="input-label" for="player-name">Аты-жөніңіз</label>
                    <input type="text" id="player-name" class="clean-input" placeholder="Мысалы: Әлихан" maxlength="25">
                </div>
                <button type="button" class="primary-btn" onclick="startQuiz()">Тестті бастау</button>
            </div>

            <!-- 2. Қатысушы: Сұрақтар экраны -->
            <div id="quiz-screen" class="hidden">
                <div class="top-meta">
                    <span id="q-progress-text">Сұрақ 1 / 4</span>
                    <span class="timer-pill">⏱ <span id="timer">15</span> сек</span>
                </div>
