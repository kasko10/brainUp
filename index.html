<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brainUp</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .box { background: #131a2a; border: 1px solid #243049; border-radius: 16px; padding: 30px; width: 90%; max-width: 500px; text-align: center; }
  input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 16px; box-sizing: border-box; }
  button { width: 100%; padding: 14px; background: #6366f1; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .opt { background: #1e293b; border: 1px solid #334155; margin-top: 10px; text-align: left; }
</style>
</head>
<body>

<div class="box" id="app">
  <h2>brainUp</h2>
  <p>Аты-жөніңізді жазыңыз</p>
  <input type="text" id="name" placeholder="Есіміңіз...">
  <button type="button" onclick="run()">Тестті бастау</button>
</div>

<script>
const q = [
  { t: "Қазақстанның астанасы?", o: ["Алматы", "Астана", "Шымкент"], c: 1 },
  { t: "1 байтта неше бит бар?", o: ["4", "8", "16"], c: 1 },
  { t: "Ең үлкен ғаламшар?", o: ["Марс", "Жер", "Юпитер"], c: 2 }
];
let i = 0, s = 0, u = "";

function run() {
  u = document.getElementById("name").value || "Қонақ";
  next();
}

function next() {
  if (i >= q.length) {
    document.getElementById("app").innerHTML = `<h2>Жарайсыз, ${u}!</h2><h1>${s} / ${q.length}</h1><button onclick="location.reload()">Қайта бастау</button>`;
    return;
  }
  let h = `<h3>${i+1}. ${q[i].t}</h3>`;
  q[i].o.forEach((x, idx) => { h += `<button class="opt" onclick="ans(${idx})">${x}</button>`; });
  document.getElementById("app").innerHTML = h;
}

function ans(idx) {
  if (idx === q[i].c) s++;
  i++;
  next();
}
</script>

</body>
</html>
