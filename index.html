<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brainUp</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
  body{background:#0b0f19;color:#f8fafc;min-height:100vh;display:flex;flex-direction:column}
  nav{background:#131a2a;border-bottom:1px solid #243049;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
  .logo{font-size:1.5rem;font-weight:800;cursor:pointer}.logo span{color:#6366f1}
  .tabs{display:flex;gap:8px}
  .tab{background:#1b2438;color:#94a3b8;border:1px solid #243049;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
  .tab.on,.tab:hover{background:rgba(99,102,241,0.2);color:#a5b4fc;border-color:#6366f1}
  main{flex:1;display:flex;justify-content:center;align-items:center;padding:20px}
  .card{background:#131a2a;border:1px solid #243049;border-radius:20px;padding:32px;width:100%;max-width:600px;box-shadow:0 20px 40px rgba(0,0,0,0.4)}
  h1,h2{margin-bottom:12px;text-align:center}
  .sub{color:#94a3b8;text-align:center;margin-bottom:24px}
  input,select{width:100%;padding:13px;margin-bottom:12px;background:#1b2438;border:1px solid #243049;border-radius:10px;color:#fff;font-size:1rem}
  .btn{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer}
  .btn:hover{background:#4f46e5}
  .btn2{background:#1b2438;border:1px solid #243049}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{width:100%;padding:14px;margin-top:10px;background:#1b2438;border:1px solid #243049;border-radius:12px;color:#fff;text-align:left;font-size:1rem;cursor:pointer}
  .opt:hover:not(:disabled){border-color:#6366f1;background:#222d45}
  .ok{background:rgba(16,185,129,0.2)!important;border-color:#10b981!important;color:#6ee7b7!important}
  .no{background:rgba(239,68,68,0.2)!important;border-color:#ef4444!important;color:#fca5a5!important}
  .item{background:#1b2438;padding:10px 14px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:0.95rem}
  .del{background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer}
  .hide{display:none}
  @media(max-width:500px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <div class="logo" onclick="show('v-home')">brain<span>Up</span></div>
  <div class="tabs">
    <button type="button" class="tab on" id="t-user" onclick="show('v-home')">Қатысушы</button>
    <button type="button" class="tab" id="t-adm" onclick="show('v-login')">Басқарушы</button>
  </div>
</nav>
<main>
  <div class="card">
    <div id="v-home">
      <h1>Біліміңізді тексеріңіз</h1>
      <p class="sub" id="q-info"></p>
      <input type="text" id="uname" placeholder="Аты-жөніңіз...">
      <button type="button" class="btn" onclick="startQuiz()">Тестті бастау</button>
    </div>

    <div id="v-login" class="hide">
      <h2>Басқарушы бөлімі</h2>
      <p class="sub">Құпиясөзді енгізіңіз (әдепкі: 1234)</p>
      <input type="password" id="apass" placeholder="Құпиясөз...">
      <button type="button" class="btn" onclick="checkPass()">Кіру</button>
    </div>

    <div id="v-quiz" class="hide">
      <div style="display:flex;justify-content:space-between;color:#94a3b8;margin-bottom:16px">
        <span id="q-num"></span><span>⏱ <b id="sec">15</b> сек</span>
      </div>
      <h2 id="q-txt" style="text-align:left;margin-bottom:16px"></h2>
      <div id="q-opts"></div>
    </div>

    <div id="v-res" class="hide" style="text-align:center">
      <h2 id="r-hi"></h2>
      <h1 id="r-pts" style="color:#818cf8;font-size:2.5rem;margin:16px 0"></h1>
      <p id="r-stat" class="sub"></p>
      <div class="grid2">
        <button type="button" class="btn" onclick="startQuiz()">Қайталау</button>
        <button type="button" class="btn btn2" onclick="show('v-home')">Жабу</button>
      </div>
    </div>

    <div id="v-adm" class="hide">
      <h2 style="text-align:left">Сұрақ құрастырушы</h2>
      <input type="text" id="nq" placeholder="Сұрақ мәтіні...">
      <div class="grid2">
        <input type="text" id="o0" placeholder="A нұсқасы">
        <input type="text" id="o1" placeholder="B нұсқасы">
        <input type="text" id="o2" placeholder="C нұсқасы">
        <input type="text" id="o3" placeholder="D нұсқасы">
      </div>
      <select id="nc">
        <option value="0">Дұрыс жауап: A</option>
        <option value="1">Дұрыс жауап: B</option>
        <option value="2">Дұрыс жауап: C</option>
        <option value="3">Дұрыс жауап: D</option>
      </select>
      <button type="button" class="btn" onclick="addQ()">+ Сұрақ қосу</button>
      <div id="adm-list" style="margin-top:16px;max-height:220px;overflow-y:auto"></div>
    </div>
  </div>
</main>

<script>
const defQ=[
  {q:"Қазақстанның астанасы қай қала?",o:["Алматы","Астана","Шымкент","Түркістан"],c:1},
  {q:"Ең үлкен ғаламшар қалай аталады?",o:["Марс","Жер","Юпитер","Сатурн"],c:2},
  {q:"1 байтта неше бит бар?",o:["4 бит","8 бит","16 бит","32 бит"],c:1},
  {q:"Абай Құнанбайұлы қай жылы туған?",o:["1845","1835","1855","1865"],c:0}
];
let qs=JSON.parse(localStorage.getItem("bu_q"))||defQ;
let idx=0,pts=0,ok=0,t=15,tm,usr="",lock=false;

function show(id){
  clearInterval(tm);
  ["v-home","v-login","v-quiz","v-res","v-adm"].forEach(v=>document.getElementById(v).classList.add("hide"));
  document.getElementById(id).classList.remove("hide");
  document.getElementById("t-user").classList.toggle("on",id!=="v-adm"&&id!=="v-login");
  document.getElementById("t-adm").classList.toggle("on",id==="v-adm"||id==="v-login");
  document.getElementById("q-info").innerText="Қазір платформада "+qs.length+" сұрақ дайын тұр.";
}
show("v-home");

function checkPass(){
  if(document.getElementById("apass").value==="1234"){
    document.getElementById("apass").value="";
    show("v-adm");renderAdm();
  }else{alert("Құпиясөз қате!");}
}
function renderAdm(){
  const box=document.getElementById("adm-list");box.innerHTML="";
  qs.forEach((x,i)=>{
    box.innerHTML+='<div class="item"><span>'+(i+1)+'. '+x.q+' <b>('+"ABCD"[x.c]+')</b></span><button class="del" onclick="delQ('+i+')">Өшіру</button></div>';
  });
}
function addQ(){
  const q=document.getElementById("nq").value.trim();
  const o0=document.getElementById("o0").value.trim();
  const o1=document.getElementById("o1").value.trim();
  const o2=document.getElementById("o2").value.trim();
  const o3=document.getElementById("o3").value.trim();
  const c=Number(document.getElementById("nc").value);
  if(!q||!o0||!o1||!o2||!o3)return alert("Барлық жолды толтырыңыз!");
  qs.push({q:q,o:[o0,o1,o2,o3],c:c});
  localStorage.setItem("bu_q",JSON.stringify(qs));
  ["nq","o0","o1","o2","o3"].forEach(i=>document.getElementById(i).value="");
  renderAdm();
}
function delQ(i){
  if(qs.length<=1)return alert("Кемінде 1 сұрақ қалуы керек!");
  qs.splice(i,1);localStorage.setItem("bu_q",JSON.stringify(qs));renderAdm();
}
function startQuiz(){
  usr=document.getElementById("uname").value.trim()||"Қонақ";
  idx=0;pts=0;ok=0;show("v-quiz");nextQ();
}
function nextQ(){
  clearInterval(tm);lock=false;t=15;
  document.getElementById("sec").innerText=t;
  document.getElementById("q-num").innerText="Сұрақ "+(idx+1)+" / "+qs.length;
  document.getElementById("q-txt").innerText=qs[idx].q;
  const box=document.getElementById("q-opts");box.innerHTML="";
  qs[idx].o.forEach((txt,i)=>{
    const b=document.createElement("button");b.type="button";b.className="opt";
    b.innerText="ABCD"[i]+") "+txt;b.onclick=()=>pick(i);box.appendChild(b);
  });
  tm=setInterval(()=>{t--;document.getElementById("sec").innerText=t;if(t<=0){clearInterval(tm);pick(-1);}},1000);
}
function pick(sel){
  if(lock)return;lock=true;clearInterval(tm);
  const cor=qs[idx].c;
  document.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled=true;if(i===cor)b.classList.add("ok");else if(i===sel)b.classList.add("no");
  });
  if(sel===cor){ok++;pts+=100+t*10;}
  setTimeout(()=>{
    idx++;if(idx<qs.length)nextQ();
    else{
      show("v-res");
      document.getElementById("r-hi").innerText="Жарайсыз, "+usr+"!";
      document.getElementById("r-pts").innerText=pts+" ұпай";
      document.getElementById("r-stat").innerText=qs.length+" сұрақтың "+ok+"-іне дұрыс жауап бердіңіз";
    }
  },900);
}
</script>
</body>
</html>
